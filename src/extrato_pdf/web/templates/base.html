<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Extrato PDF{% endblock %} · TCC 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var k = "extrato-pdf-theme";
        var t = localStorage.getItem(k);
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css?v={{ static_v }}" />
</head>
<body>
  <div id="toast-host" aria-live="polite" aria-atomic="true"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <p class="brand">
          <span class="brand-mark" aria-hidden="true">EP</span>
          <span class="brand-text">
            Extrato PDF
            <small>TCC 3 · local</small>
          </span>
        </p>
        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Fechar menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <nav class="nav" aria-label="Menu principal">
        {% for item in menu %}
          <a href="{{ item.href }}" class="nav-link {% if ativo == item.id %}ativo{% endif %}">{{ item.label }}</a>
        {% endfor %}
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="theme-switch" id="btn-theme" aria-label="Alternar tema claro ou escuro">
          <span class="theme-switch-icon" aria-hidden="true">☾</span>
          <span class="theme-switch-label">Modo escuro</span>
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <span class="topbar-title">Extrato PDF</span>
        <button type="button" class="theme-switch theme-switch--compact" id="btn-theme-top" aria-label="Alternar tema">
          <span class="theme-switch-icon" aria-hidden="true">☾</span>
        </button>
      </header>
      <main class="content" id="conteudo-principal">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <script src="/static/app.js?v={{ static_v }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
